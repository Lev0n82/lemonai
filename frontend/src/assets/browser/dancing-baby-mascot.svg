<svg viewBox="0 0 180 240" xmlns="http://www.w3.org/2000/svg">
  <style>
    .outline {
      stroke: rgba(83, 55, 26, 0.55);
      stroke-width: 2.2;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    .whole {
      transform-origin: 50% 58%;
      animation: slowTurn 4.6s ease-in-out infinite alternate;
    }

    .head {
      transform-origin: 90px 52px;
      animation: headBob 0.82s ease-in-out infinite alternate;
    }

    .torso {
      transform-origin: 90px 112px;
      animation: torsoWiggle 0.62s ease-in-out infinite alternate;
    }

    .arm-up {
      transform-origin: 62px 100px;
      animation: armWave 0.5s ease-in-out infinite alternate;
    }

    .arm-low {
      transform-origin: 117px 103px;
      animation: armSwing 0.78s ease-in-out infinite alternate;
    }

    .hips {
      transform-origin: 90px 146px;
      animation: hipsShift 0.62s ease-in-out infinite alternate;
    }

    .leg-left {
      transform-origin: 82px 152px;
      animation: stepLeft 0.62s ease-in-out infinite alternate;
    }

    .leg-right {
      transform-origin: 98px 152px;
      animation: stepRight 0.62s ease-in-out infinite alternate;
    }

    .shadow {
      opacity: 0.18;
      animation: shadowPulse 0.62s ease-in-out infinite alternate;
    }

    @keyframes slowTurn {
      from { transform: rotate(-8deg) scale(0.98); }
      to { transform: rotate(8deg) scale(1.03); }
    }

    @keyframes headBob {
      from { transform: rotate(-4deg) translateY(0); }
      to { transform: rotate(3deg) translateY(-2px); }
    }

    @keyframes torsoWiggle {
      from { transform: rotate(-10deg); }
      to { transform: rotate(10deg); }
    }

    @keyframes armWave {
      from { transform: rotate(-20deg); }
      to { transform: rotate(14deg); }
    }

    @keyframes armSwing {
      from { transform: rotate(10deg); }
      to { transform: rotate(-14deg); }
    }

    @keyframes hipsShift {
      from { transform: rotate(-8deg) translateY(0); }
      to { transform: rotate(8deg) translateY(2px); }
    }

    @keyframes stepLeft {
      from { transform: rotate(20deg); }
      to { transform: rotate(2deg); }
    }

    @keyframes stepRight {
      from { transform: rotate(-2deg); }
      to { transform: rotate(-22deg); }
    }

    @keyframes shadowPulse {
      from { transform: scaleX(0.9); opacity: 0.12; }
      to { transform: scaleX(1.04); opacity: 0.2; }
    }
  </style>

  <ellipse class="shadow" cx="90" cy="214" rx="32" ry="10" fill="#674728" />

  <g class="whole">
    <g class="head">
      <path class="outline" d="M55 53c0-20 17-35 35-35s35 15 35 35c0 15-10 31-35 31S55 68 55 53Z" fill="#f4c98d" />
      <path class="outline" d="M72 29c5-10 29-10 35 2" fill="none" />
      <path class="outline" d="M78 40c4-5 11-7 18-6" fill="none" />
      <ellipse cx="78" cy="53" rx="4.2" ry="5.2" fill="#2f2015" />
      <ellipse cx="102" cy="51" rx="6.6" ry="4.3" fill="#2f2015" />
      <path class="outline" d="M95 63c7 4 14 3 18-1" fill="none" stroke="#8f5a42" />
      <circle cx="68" cy="61" r="3.2" fill="#efb291" opacity="0.55" />
      <circle cx="111" cy="59" r="3.2" fill="#efb291" opacity="0.45" />
    </g>

    <g class="arm-up">
      <path class="outline" d="M65 101c-11-12-21-29-18-50" fill="none" stroke="#f4c98d" stroke-width="13" />
      <circle cx="48" cy="49" r="6" fill="#f4c98d" />
    </g>

    <g class="arm-low">
      <path class="outline" d="M118 103c18 8 26 21 22 40" fill="none" stroke="#f4c98d" stroke-width="13" />
      <circle cx="139" cy="144" r="6" fill="#f4c98d" />
    </g>

    <g class="torso">
      <path class="outline" d="M66 89c3-13 45-13 48 0l8 48c2 12-12 18-32 18s-34-6-32-18Z" fill="#f0ba61" />
      <ellipse class="outline" cx="92" cy="119" rx="19" ry="24" fill="#f7d8a2" />
      <ellipse cx="90" cy="111" rx="2.4" ry="2.1" fill="#cf9d5a" />
      <ellipse cx="92" cy="122" rx="2.4" ry="2.1" fill="#cf9d5a" />
    </g>

    <g class="hips">
      <ellipse class="outline" cx="91" cy="150" rx="23" ry="10" fill="#eeb058" />
    </g>

    <g class="leg-left">
      <path class="outline" d="M84 153c-10 19-16 36-12 58" fill="none" stroke="#f4c98d" stroke-width="14" />
      <ellipse cx="76" cy="213" rx="10" ry="6" fill="#f4c98d" />
    </g>

    <g class="leg-right">
      <path class="outline" d="M97 153c11 17 16 35 11 58" fill="none" stroke="#f4c98d" stroke-width="14" />
      <ellipse cx="105" cy="213" rx="10" ry="6" fill="#f4c98d" />
    </g>
  </g>
</svg>